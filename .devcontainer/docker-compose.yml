services:
  # TODO: mock cups server.

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register:ci@sha256:cdd7be608188b5f4a04473aae9fe86dcc920afd76ec9b6385d6735b107812b4d
    # Drizzle studio has problems running inside a docker container. The other
    # solution would be running a reverse proxy, but this is simpler.
    network_mode: host
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
    working_dir: /workspace

volumes:
  pnpm-cache: {}
