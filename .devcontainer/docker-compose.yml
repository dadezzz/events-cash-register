services:
  # TODO: mock cups server.

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register:ci@sha256:9ca293137d428c6003324c3873cb146c14b94b41cea981ab11262467eb6e67fe
    # Drizzle studio has problems running inside a docker container. The other
    # solution would be running a reverse proxy, but this is simpler.
    network_mode: host
    volumes:
      - ..:/workspace:z,cached
      - pnpm-cache:/usr/local/pnpm/store
    working_dir: /workspace

volumes:
  pnpm-cache: {}
