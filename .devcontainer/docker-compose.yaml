    volumes:
      - ../data/receipts:/var/spool/ippeveprinter:z

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.09.20.1@sha256:fcf943ffdf3f0394022c0f6bde23c9e7497a9cfe481c253731e88e337a829db9
