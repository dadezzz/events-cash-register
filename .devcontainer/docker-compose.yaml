services:
  cups:
    image: git.zarantonello.dev/projects/events-cash-register-cups:v2026.09.19.1@sha256:377e00029f65ef6e2d1e68ed703c92c2e0209e66dd282ac6e502251abe77b308
    volumes:
      - ../data/receipts:/var/spool/ippeveprinter:z

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.10.09.1@sha256:83a4d41c5d747657d37ce77dff4e3b154fdd51b266c3aff75003d9833d15c5c8
