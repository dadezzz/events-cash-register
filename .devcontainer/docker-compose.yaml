    volumes:
      - ../data/receipts:/var/spool/ippeveprinter:z

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.09.23.2@sha256:f811d0897cba42ac3760f67d13cd4382ea8683e745d6faf39d21112add72819a
