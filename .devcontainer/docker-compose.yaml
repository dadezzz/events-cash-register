    volumes:
      - ../data/receipts:/var/spool/ippeveprinter:z

  workspace:
    entrypoint: sleep infinity
    env_file: ../.env
    image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.11.16.1@sha256:4a2975c7ee9e438247c37db6e1e9663a7150b12bc88f6b07eecb42d611006e49
