concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.11.15.1@sha256:8a78f0e34eb4a9727bf01e9bf78ce88ee4e6201315f06a8c9c3bb22c55f53909
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-projects-events-cash-register-turbo:/cache/turbo
    env:
      TURBO_CACHE_DIR: /cache/turbo
    name: Checks with static tools
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run types and syntax check
        run: turbo run check
      - name: Build the website
        run: turbo run build
      - name: Run tests
        run: turbo run test

name: check.yaml

"on":
  pull_request:
    branches:
      - main
