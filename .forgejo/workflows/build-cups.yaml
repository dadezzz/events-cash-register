concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  build:
    container:
      image: quay.io/containers/aio:latest@sha256:2e53902fd1228b42936b117f20734f1b102a87c25727a3dd54ad1a13a89af9c2
    env:
      IMAGE: git.zarantonello.dev/${{ forge.repository }}:cups
      name: Build the cups container
    runs-on: srv-hetz-nbg-0
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Disable fuse-overlayfs
        run: |
          sed -i 's|mountopt = "nodev,fsync=0"||' /etc/containers/storage.conf;
          sed -i 's|mount_program = "/usr/bin/fuse-overlayfs"||' /etc/containers/storage.conf;
      - name: Login to the container registry
        run: podman login git.zarantonello.dev -u ${{ secrets.REGISTRY_USER }} -p ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build the container image
        run: podman build --jobs 2 --tag ${{ env.IMAGE }} . --file cups.Dockerfile
      - name: Push the container image
        run: podman push ${{ env.IMAGE }}

name: build-cups.yaml

"on":
  push:
    branches:
      - main
    paths:
      - cups.Dockerfile
      - cups.entrypoint.sh
      - cupsd.conf
  workflow_dispatch: {}
