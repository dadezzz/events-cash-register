concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/projects/events-cash-register:ci@sha256:46f0ca06654b941cde3dde2d1cc00b36ce50c3f172754aaf9f1e16d3852b2c37
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
    name: Checks with linters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run linter
        run: |
          pnpm run -r --no-sort --aggregate-output setup
          pnpm run -r --no-sort --aggregate-output lint:check

name: check-linter.yaml

"on":
  pull_request:
    branches:
      - main
