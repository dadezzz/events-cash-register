concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.11.22.1@sha256:dab719003fdda1a2e9cf18c52cbe7763fe936de60d58c6e084766fe7ba721fcf
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-projects-events-cash-register-turbo:/cache/turbo
    env:
      TURBO_CACHE_DIR: /cache/turbo
    name: Checks with linters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run linter
        run: turbo run lint:check

name: check-linter.yaml

"on":
  pull_request:
    branches:
      - main
