concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/projects/events-cash-register-ci:v2026.11.01.1@sha256:0c5ebf06e329584fb9314f9e79fde140365866447c21919fb644969c7ad9bb84
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-projects-events-cash-register-turbo:/cache/turbo
    env:
      TURBO_CACHE_DIR: /cache/turbo
    name: Checks with formatters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}:x-oauth-basic@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run formatter
        run: turbo run format:check

name: check-formatter.yaml

"on":
  pull_request:
    branches:
      - main
