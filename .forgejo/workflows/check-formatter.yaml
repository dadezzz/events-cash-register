concurrency:
  cancel-in-progress: true
  group: ${{ forge.ref }}-${{ forge.workflow }}

jobs:
  check:
    container:
      image: git.zarantonello.dev/projects/events-cash-register:ci@sha256:2c752fc85581a79bce8c6338971f06eebb1835479dfbceb562e5ccb10d134d1b
      volumes:
        - forgejo-runner-cache-pnpm:/usr/local/pnpm/store
        - forgejo-runner-cache-projects-events-cash-register-turbo:/cache/turbo
    env:
      TURBO_CACHE_DIR: /cache/turbo
    name: Checks with formatters
    runs-on: srv-generic
    steps:
      - name: Clone the repository
        run: |
          git clone --filter=blob:none --no-checkout https://${{ forge.token }}@git.zarantonello.dev/${{ forge.repository }} ${{ forge.workspace }};
          git checkout --quiet ${{ forge.sha }};
      - name: Install dependencies with pnpm
        run: pnpm install
      - name: Run formatter
        run: turbo run format:check

name: check-formatter.yaml

"on":
  pull_request:
    branches:
      - main
